name: Daily paper run
on:
  schedule:
    # Close run at 4:45pm ET year-round. Cron is UTC, so both DST offsets are
    # scheduled and the guard step runs only the one matching the current
    # regime: 20:45 UTC = 4:45pm EDT (Mar–Nov), 21:45 UTC = 4:45pm EST.
    # Always ≥45 min after the 4pm close, when daily bars are settled.
    - cron: "45 20 * * 1-5"
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}   # manual trigger for testing / catch-up runs

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: DST guard — run each cron only in its own DST regime (delay-proof)
        id: guard
        # GitHub fires schedules late (30-90 min is common), so never gate on
        # the hour of day — that skipped real runs. Instead match the cron
        # that fired (github.event.schedule) to the DST regime it belongs to:
        # the 20:45 UTC cron is the real 4:45pm only while ET is UTC-4 (EDT),
        # the 21:45 UTC cron only while ET is UTC-5 (EST).
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          offset=$(TZ=America/New_York date +%z)
          case "${{ github.event.schedule }}|$offset" in
            "45 20 * * 1-5|-0400"|"45 21 * * 1-5|-0500") go=true ;;
            *) go=false; echo "off-DST duplicate cron (offset $offset) — skipping" ;;
          esac
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"
      - if: steps.guard.outputs.go == 'true'
        run: pip install -r requirements.txt
      - name: Run tests first (never trade on broken code)
        if: steps.guard.outputs.go == 'true'
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      - name: Close cycle — fetch, fill, score, propose
        if: steps.guard.outputs.go == 'true'
        run: python run_daily.py
      - name: Rebuild dashboard
        if: steps.guard.outputs.go == 'true'
        run: python reports/make_dashboard.py
      - name: Commit data + state + dashboard back to the repo
        if: steps.guard.outputs.go == 'true'
        run: |
          git config user.name "paper-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data state docs
          git diff --cached --quiet || git commit -m "daily run $(date -u +%F)"
          git pull --rebase origin main || true
          git push
