name: Morning fill
on:
  schedule:
    # Book queued orders at the real 9:30am ET open, ~10 min after it happens.
    # Both DST offsets scheduled; the guard runs only the one where the ET
    # hour == 09: 13:40 UTC = 9:40am EDT, 14:40 UTC = 9:40am EST.
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - name: DST guard — proceed only at 9am ET hour (or manual dispatch)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "$(TZ=America/New_York date +%H)" = "09" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "off-DST duplicate — skipping"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"
      - if: steps.guard.outputs.go == 'true'
        run: pip install -r requirements.txt
      - name: Morning cycle — fill queued orders at today's open (no scoring)
        if: steps.guard.outputs.go == 'true'
        run: python run_daily.py --fills-only --no-news
      - name: Rebuild dashboard
        if: steps.guard.outputs.go == 'true'
        run: python reports/make_dashboard.py
      - name: Commit state + dashboard
        if: steps.guard.outputs.go == 'true'
        run: |
          git config user.name "paper-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data state docs
          git diff --cached --quiet || git commit -m "morning fill $(date -u +%F)"
          git pull --rebase origin main || true
          git push
