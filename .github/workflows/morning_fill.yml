name: Morning fill
on:
  schedule:
    # Book queued orders at the real 9:30am ET open, ~10 min after it happens.
    # Both DST offsets scheduled; the guard runs only the one where the ET
    # hour == 09: 13:40 UTC = 9:40am EDT, 14:40 UTC = 9:40am EST.
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - name: DST guard — run each cron only in its own DST regime (delay-proof)
        id: guard
        # GitHub fires schedules late (30-90 min is common), so never gate on
        # the hour of day — that skipped real runs. Instead match the cron
        # that fired (github.event.schedule) to the DST regime it belongs to:
        # the 13:40 UTC cron is the real 9:40am only while ET is UTC-4 (EDT),
        # the 14:40 UTC cron only while ET is UTC-5 (EST).
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          offset=$(TZ=America/New_York date +%z)
          case "${{ github.event.schedule }}|$offset" in
            "40 13 * * 1-5|-0400"|"40 14 * * 1-5|-0500") go=true ;;
            *) go=false; echo "off-DST duplicate cron (offset $offset) — skipping" ;;
          esac
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"
      - if: steps.guard.outputs.go == 'true'
        run: pip install -r requirements.txt
      - name: Morning cycle — fill queued orders at today's open (no scoring)
        if: steps.guard.outputs.go == 'true'
        run: python run_daily.py --fills-only --no-news
      - name: Rebuild dashboard
        if: steps.guard.outputs.go == 'true'
        run: python reports/make_dashboard.py
      - name: Commit state + dashboard
        if: steps.guard.outputs.go == 'true'
        run: |
          git config user.name "paper-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data state docs
          git diff --cached --quiet || git commit -m "morning fill $(date -u +%F)"
          git pull --rebase origin main || true
          git push
